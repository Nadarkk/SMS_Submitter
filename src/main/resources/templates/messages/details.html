<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Message Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<div class="container my-4">
  <div class="d-flex justify-content-between align-items-center">
    <h2>Message Details</h2>
    <a th:href="@{/messages(targetCompanyId=${targetCompanyId})}" class="btn btn-secondary">Back to Messages</a>
  </div>
  <hr />

  <!-- Message Summary Card -->
  <div class="card mb-4">
    <div class="card-body">
      <div class="row mb-2">
        <div class="col-md-3 fw-bold">Sender:</div>
        <div class="col-md-9" th:text="${message.sender}">Sender Name</div>
      </div>
      <div class="row mb-2">
        <div class="col-md-3 fw-bold">Date Sent:</div>
        <div class="col-md-9" th:text="${#temporals.format(message.sendDate, 'dd MMM yyyy HH:mm:ss')}">Date</div>
      </div>
      <div class="row mb-2">
        <div class="col-md-3 fw-bold">Segments:</div>
        <div class="col-md-9" th:text="${message.segmentCount}">1</div>
      </div>
      <div class="row mb-2" th:if="${message.templateName}">
        <div class="col-md-3 fw-bold">Used Template:</div>
        <div class="col-md-9" th:text="${message.templateName}">Template</div>
      </div>
      <div class="row mb-2">
        <div class="col-md-3 fw-bold">Content:</div>
        <div class="col-md-9" th:text="${message.body}">Message body...</div>
      </div>
    </div>
  </div>

  <!-- Recipients & Individual SMS Statuses -->
  <h4>Recipients (<span th:text="${message.recipients != null ? message.recipients.size() : 0}">0</span>)</h4>
  <table class="table table-bordered table-striped align-middle mt-3">
    <thead class="table-dark">
    <tr>
      <th>Contact Name</th>
      <th>Phone Number</th>
      <th>SIM ID</th>
      <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="sms : ${message.recipients}">
      <td th:text="${sms.contactName}">John Doe</td>
      <td th:text="${sms.contactPhone}">+123456789</td>
      <td th:text="${sms.simId != null ? sms.simId : 'N/A'}">SIM123</td>
      <td th:text="${sms.status}"></td>
    </tr>
    </tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
