<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{nav :: navbar}"></div>

<div class="container my-4">

    <div class="d-flex justify-content-between align-items-center">
        <h2>Message History</h2>
        <div>
            <a th:if="${isAdmin}" th:href="@{/messages}" class="btn btn-outline-secondary me-2">Change Company</a>
            <a th:href="@{/messages/send(targetCompanyId=${targetCompanyId})}" class="btn btn-primary">Send Message</a>
        </div>
    </div>
    <hr />

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div th:if="${#lists.isEmpty(messages)}" class="text-muted">No messages sent yet.</div>

    <table class="table table-hover align-middle" th:unless="${#lists.isEmpty(messages)}">
        <thead class="table-dark">
        <tr>
            <th>Date</th>
            <th>Sender</th>
            <th>Body</th>
            <th>Segments</th>
            <th>Recipients</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${messages}">
            <td th:text="${#temporals.format(m.sendDate, 'dd MMM yyyy HH:mm')}">Date</td>
            <td th:text="${m.sender}">Sender</td>
            <td style="max-width: 300px; word-wrap: break-word; white-space: normal;">
                <span th:text="${#strings.abbreviate(m.body, 100)}">Body</span>
            </td>
            <td th:text="${m.segmentCount}">1</td>
            <td>
            <span class="badge bg-secondary"
                  th:text="${m.recipients != null ? m.recipients.size() : 0} + ' Recipients'">
                0 Recipients
            </span>
            </td>
            <td>
                <a th:href="@{/messages/{id}(id=${m.messageId}, targetCompanyId=${targetCompanyId})}"
                   class="btn btn-sm btn-info text-white">View Details</a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
