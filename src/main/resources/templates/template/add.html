<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Template</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{nav :: navbar}"></div>
<div class="container">
    <h2>Add Template</h2>
    <form th:action="@{/template(targetCompanyId=${targetCompanyId})}" method="post" th:object="${template}">
        <input type="hidden" name="targetCompanyId" th:value="${targetCompanyId}"/>
        <div class="mb-3">
            <label class="form-label">Template Name</label>
            <input type="text" class="form-control" th:field="*{name}"/>
            <span class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>
        <div class="mb-3">
            <label class="form-label">Template Body</label>
            <textarea class="form-control" rows="4" th:field="*{body}"></textarea>
            <span class="text-danger" th:if="${#fields.hasErrors('body')}" th:errors="*{body}"></span>
        </div>
        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-outline-secondary" th:href="@{/template(targetCompanyId=${targetCompanyId})}">Cancel</a>
    </form>
</div>
</body>
</html>
