<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Users List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<body >
<div th:replace="~{nav :: navbar}"></div>
<div class="container my-4">


<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>User Management</h2>

    <div class="d-flex gap-2">
        <!-- Optional Filter Dropdown -->
        <form th:action="@{/users}" method="get" class="d-flex align-items-center gap-2">
            <select name="targetCompanyId" class="form-select" onchange="this.form.submit()">
                <option value="">All Companies</option>
                <option th:each="company : ${companies}"
                        th:value="${company.companyId}"
                        th:text="${company.companyName}"
                        th:selected="${company.companyId == targetCompanyId}">
                </option>
            </select>
        </form>

        <a th:href="@{/users/add}" class="btn btn-primary text-nowrap">+ Add New User</a>
    </div>

</div>


<!-- Alert for Success Message after creation/toggle -->
<div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${successMessage}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>

<!-- Users Table -->
<table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
        <th>#</th>
        <th>Name</th>
        <th>Phone Number</th>
        <th>Role</th>
        <th>Company</th>
        <th>Status</th>
        <th sec:authorize="hasRole('ADMIN')">Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user, iterStat : ${users}">
        <td th:text="${iterStat.count}"></td>
        <td th:text="${user.firstName + ' ' + user.lastName}"></td>
        <td th:text="${user.phoneNo}"></td>
        <td>
            <span class="badge"
                  th:classappend="${user.role.name() == 'ADMIN' ? 'bg-danger' : (user.role.name() == 'MANAGER' ? 'bg-warning text-dark' : 'bg-secondary')}"
                  th:text="${user.role}">
            </span>
        </td>
        <td th:text="${user.companyName}"></td>
        <td>
            <span th:if="${user.isActive}" class="badge bg-success">Active</span>
            <span th:unless="${user.isActive}" class="badge bg-danger">Inactive</span>
        </td>

        <!-- Toggle Action Button for ADMIN -->
        <td sec:authorize="hasRole('ADMIN')">
            <form th:action="@{/users/{id}/toggle-status(id=${user.userId})}" method="post" class="d-inline">
                <input type="hidden" name="targetCompanyId" th:value="${targetCompanyId}" />
                <button type="submit"
                        class="btn btn-sm"
                        th:classappend="${user.isActive} ? 'btn-outline-danger' : 'btn-outline-success'"
                        th:text="${user.isActive} ? 'Deactivate' : 'Activate'">
                </button>
            </form>
        </td>
    </tr>

    <!-- Empty State Message -->
    <tr th:if="${#lists.isEmpty(users)}">
        <td sec:authorize="hasRole('ADMIN')" colspan="7" class="text-center text-muted py-3">No users found.</td>
        <td sec:authorize="!hasRole('ADMIN')" colspan="6" class="text-center text-muted py-3">No users found.</td>
    </tr>
    </tbody>
</table>
</div>
</body>
</html>
