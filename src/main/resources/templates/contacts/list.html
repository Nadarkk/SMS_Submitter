<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contacts</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{nav :: navbar}"></div>
<div class="container my-4">
    <h1 class="text-center mb-4">Contacts List</h1>

    <!-- Hide "Add New Contact" from standard USERs -->
    <div class="d-flex justify-content-end mb-3"
         th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''MANAGER'')')}">
        <a th:href="@{/contacts/add(targetCompanyId=${targetCompanyId})}" class="btn btn-primary">
            Add New Contact
        </a>
    </div>

    <table class="table table-striped table-hover border align-middle">
        <thead class="table-dark">
        <tr >
            <th>Name</th>
            <th>Phone Number</th>
            <th>Company</th>
            <!-- Show Actions column only to Managers and Admins -->
            <th th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''MANAGER'')')}">Actions</th>
        </tr>
        </thead>
        <tbody th:each="contact : ${contacts}">

        <!-- 1. Normal Row View (Uses contact.contactId) -->
        <tr th:if="${editId != contact.contactId}">
            <td th:text="${contact.name}">Name</td>
            <td th:text="${contact.phoneNo}">Phone</td>
            <td th:text="${contact.companyName}">Company</td>
            <td th:if="${#authorization.expression('hasRole(''ADMIN'') or hasRole(''MANAGER'')')}">
                <div class="d-flex gap-2">
                    <!-- Edit Button triggers inline edit mode -->
                    <a th:href="@{/contacts(targetCompanyId=${targetCompanyId}, editId=${contact.contactId})}"
                       class="btn btn-sm btn-outline-primary">Edit</a>

                    <!-- Delete Form with CSRF safety -->
                    <form th:action="@{/contacts/delete/{id}(id=${contact.contactId}, targetCompanyId=${targetCompanyId})}" method="post">
                        <button type="submit" class="btn btn-sm btn-outline-danger"
                                onclick="return confirm('Are you sure you want to delete this contact?');">Delete</button>
                    </form>
                </div>
            </td>
        </tr>

        <!-- 2. Inline Edit Form (Checks editId against contact.contactId) -->
        <tr th:if="${editId == contact.contactId}">
            <td colspan="4" class="p-2 table-light">
                <form th:action="@{/contacts/edit/{id}(id=${contact.contactId}, targetCompanyId=${targetCompanyId})}"
                      th:object="${editContactDto}" method="post" class="d-flex gap-2 align-items-start">

                    <div class="flex-grow-1">
                        <input type="text" th:field="*{name}" class="form-control form-control-sm"
                               placeholder="Name" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>

                    <div class="flex-grow-1">
                        <input type="text" th:field="*{phoneNo}" class="form-control form-control-sm"
                               placeholder="Phone Number" th:classappend="${#fields.hasErrors('phoneNo')} ? 'is-invalid' : ''">
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('phoneNo')}" th:errors="*{phoneNo}"></div>
                    </div>

                    <div class="pt-1 text-muted" th:text="${contact.companyName}">Company</div>

                    <div class="d-flex gap-1">
                        <button type="submit" class="btn btn-sm btn-success">Save</button>
                        <a th:href="@{/contacts(targetCompanyId=${targetCompanyId})}" class="btn btn-sm btn-secondary">Cancel</a>
                    </div>
                </form>
            </td>
        </tr>

        </tbody>

        <!-- Empty State -->
        <tbody th:if="${#lists.isEmpty(contacts)}">
        <tr>
            <td colspan="4" class="text-center text-muted">No contacts available.</td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
