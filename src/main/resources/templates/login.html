<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <style>
        :root {
            --vf-red: #E60000;
            --vf-dark-red: #B30000;
            --vf-gray-bg: #F8F9FA;
        }

        body {
            background-color: var(--vf-gray-bg);
            color: #2D2D2D;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .btn-primary {
            background-color: var(--vf-red) !important;
            border-color: var(--vf-red) !important;
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--vf-dark-red) !important;
            border-color: var(--vf-dark-red) !important;
        }

        .form-control:focus {
            border-color: var(--vf-red);
            box-shadow: 0 0 0 0.25rem rgba(230, 0, 0, 0.20);
        }

        .toggle-password-btn {
            border-left: none;
            background-color: #ffffff;
            cursor: pointer;
        }

        .password-field {
            border-right: none;
        }
    </style>
</head>
<body>
<div class="container" style="max-width: 400px; margin-top: 80px;">
    <h1 class="mb-4">Login</h1>

    <!-- Error & Logout Alerts -->
    <div class="alert alert-danger" th:if="${param.error != null}">Invalid phone number or password.</div>
    <div class="alert alert-success" th:if="${param.logout != null}">Logged out.</div>

    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" name="username" required autocomplete="username"/>
        </div>

        <!-- Password Input with Eye Toggle -->
        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control password-field" name="password" required autocomplete="current-password"/>
                <span class="input-group-text toggle-password-btn" id="togglePassword">
                    <i class="bi bi-eye-slash" id="toggleIcon"></i>
                </span>
            </div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Log In</button>
    </form>
</div>

<script>
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);

        toggleIcon.classList.toggle('bi-eye');
        toggleIcon.classList.toggle('bi-eye-slash');
    });
</script>
</body>
</html>
