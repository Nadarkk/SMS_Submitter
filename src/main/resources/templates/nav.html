<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="navbar">
    <style>
        :root {
            --vf-red: #E60000;
            --vf-dark-red: #B30000;
            --vf-black: #111111;
            --vf-gray-bg: #F8F9FA;
        }

        body {
            background-color: var(--vf-gray-bg);
            color: #2D2D2D;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* Navbar Brand & Header */
        .bg-vodafone {
            background-color: var(--vf-red) !important;
        }

        /* Primary Action Buttons */
        .btn-primary {
            background-color: var(--vf-red) !important;
            border-color: var(--vf-red) !important;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--vf-dark-red) !important;
            border-color: var(--vf-dark-red) !important;
        }

        /* Outline Primary Buttons */
        .btn-outline-primary {
            color: var(--vf-red) !important;
            border-color: var(--vf-red) !important;
        }
        .btn-outline-primary:hover {
            background-color: var(--vf-red) !important;
            color: #FFFFFF !important;
        }

        .table, thead {
            background-color: var(--vf-black) !important;
            color: #FFFFFF !important;
        }
        .card-header.bg-primary {
            background-color: var(--vf-red) !important;
        }

        /* Form Focus Highlight */
        .form-control:focus, .form-select:focus {
            border-color: var(--vf-red);
            box-shadow: 0 0 0 0.25rem rgba(230, 0, 0, 0.20);
        }
    </style>

    <!-- Red Navbar Header -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-vodafone mb-4 px-3 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" th:href="@{/}">SMS SUBMITTER</a>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link fw-semibold" th:href="@{/contacts}">Contacts</a>
                <a class="nav-link fw-semibold" th:href="@{/template}">Templates</a>
                <a class="nav-link fw-semibold" th:href="@{/messages}">Messages</a>
                <a class="nav-link fw-semibold" th:href="@{/dashboard}">Dashboard</a>
                <!-- Hide Companies link from standard USERs -->
                <a class="nav-link fw-semibold" th:href="@{/companies}"
                   th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Companies</a>

                <!-- Hide Users link from standard USERs -->
                <a class="nav-link fw-semibold" th:href="@{/users}"
                   th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Users</a>
                <!-- Logout Form -->
                <form th:action="@{/logout}" method="post" class="d-inline ms-2">
                    <button type="submit" class="btn btn-sm btn-outline-light fw-semibold">Logout</button>
                </form>
            </div>
        </div>
    </nav>
</div>

</body>
</html>
